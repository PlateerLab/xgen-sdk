name: Service authentication contracts

on:
  pull_request:
    paths:
      - 'src/xgen_sdk/auth/**'
      - 'tests/test_principal_auth.py'
      - 'tests/test_document_capability.py'
      - 'tests/test_p1_security_contract.py'
      - 'pyproject.toml'
      - '.github/workflows/service-auth.yml'

permissions:
  contents: read

jobs:
  authentication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install . pytest==9.1.1
      - name: Verify legacy and split authentication contracts
        env:
          PYTHONPATH: src
        run: python -m pytest tests/test_principal_auth.py tests/test_document_capability.py tests/test_p1_security_contract.py -q
